<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Islanding WebMCP Grid Resilience Lab</title>
  <desc id="description">A dark blue social card for a human-guided synthetic grid restoration simulator with visible approval and one-time receipts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#132746"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="1040" cy="105" r="150" fill="#49d8ff" opacity=".07"/>
  <circle cx="1070" cy="540" r="230" fill="#70e7aa" opacity=".06"/>

  <g transform="translate(76 76)">
    <rect width="74" height="74" rx="20" fill="#10243e" stroke="#54d8ff" stroke-width="2"/>
    <path d="M20 31l14 9 9-18 14 25" fill="none" stroke="#65ddff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="34" fill="#f4f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="5">ISLANDING</text>
    <text x="98" y="64" fill="#9bb2d1" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="3">GRID RESILIENCE LAB</text>
  </g>

  <text x="76" y="246" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="750">
    Human-guided restoration,
  </text>
  <text x="76" y="316" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="750">
    expressed as WebMCP tools.
  </text>
  <text x="78" y="368" fill="#b8c8dd" font-family="Segoe UI, Arial, sans-serif" font-size="25">
    Synthetic planning, shared state, visible approval, attributable receipt.
  </text>

  <g transform="translate(82 448)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 38h156m70 0h150m70 0h148" stroke="#506887" stroke-width="8"/>
    <path d="M42 38h118" stroke="#ff6f7f" stroke-width="8" stroke-dasharray="12 13"/>
    <circle cx="42" cy="38" r="29" fill="#132945" stroke="#ff7182" stroke-width="4"/>
    <circle cx="233" cy="38" r="29" fill="#132945" stroke="#ffd166" stroke-width="4"/>
    <path d="M220 48l26-20" stroke="#ffd166" stroke-width="6"/>
    <circle cx="453" cy="38" r="29" fill="#132945" stroke="#58d7ff" stroke-width="4"/>
    <circle cx="673" cy="38" r="29" fill="#132945" stroke="#75e4ac" stroke-width="4"/>
    <path d="M663 38l8 9 17-22" stroke="#75e4ac" stroke-width="6"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">
    <rect x="782" y="470" width="330" height="66" rx="18" fill="#142b49" stroke="#3d597d"/>
    <circle cx="820" cy="503" r="8" fill="#70e7aa"/>
    <text x="842" y="511" fill="#eaf3ff">9 semantic tools · human last word</text>
  </g>
</svg>
